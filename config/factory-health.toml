# Factory health — configurable bands (edit freely; script reloads each run).
# Override path: FACTORY_HEALTH_CONFIG=/path/to.toml
# State (history + alert streaks): ~/.last-stack/state/factory-health/

[general]
# Local timezone for quiet hours (IANA). Empty = system local.
timezone = "America/Los_Angeles"
# How often launchd should fire (document only; plist owns interval).
cadence_min = 60
# Prefer live factory dashboard when up.
factory_url = "http://127.0.0.1:4177"
# Use completed hour (hourAgo=1), not partial current hour, for ship-rate checks.
use_completed_hour = true

[notify]
enabled = true
# ra notify priority when any HARD fires; SOFT uses low.
priority_hard = "high"
priority_soft = "normal"
# Re-notify same fingerprint at most this often (seconds).
cooldown_s = 3600
# Suppress relative (ratio/z) ship alerts in these local hours (inclusive start, exclusive end).
quiet_hours = [0, 8]
# Absolute HARD alerts still fire during quiet hours if true.
quiet_allows_hard = true

[auto_fix]
# Class A (host-track/install freeze) self-heal is trusted: zero-LLM, bounded,
# never restarts lastdbd. factory_heal starts the state-machine definition
# that snapshots → closeout/class-a → verify (and files a card if still stuck).
enabled = true
# Allowed action ids: class_a_heal, factory_heal, board_closeout, report_only
actions = ["class_a_heal", "factory_heal"]

# ── Ship rate ──────────────────────────────────────────────────────────────
# Compare last completed hour ships to the rolling 24h baseline of hourly ships.
# Fire SOFT only if ALL of:
#   1. baseline mean >= min_baseline_mean (avoids overnight false positives)
#   2. last hour < ratio * mean
#   3. last hour < mean - z * std   (when std>0; else ratio alone)
#   4. consecutive_hours completed hours fail the band (hysteresis)
# HARD if last hour is also below hard_ratio * mean (stricter).
[ship_rate]
enabled = true
window_hours = 24
min_baseline_mean = 1.0
soft_ratio = 0.50
hard_ratio = 0.25
z_score = 1.5
consecutive_hours = 2
# Absolute floor: never alert relative if last hour still has at least this many ships
# (and mean is modest). Set 0 to disable.
absolute_floor = 0

# ── Doing age / occupancy ──────────────────────────────────────────────────
[doing]
enabled = true
# Max age (hours) of any single doing card by position doing-since.
soft_max_age_h = 2.0
hard_max_age_h = 5.0
# Count of doing cards older than soft_max_age_h.
soft_stale_count = 3
hard_stale_count = 8
# Absolute doing column size.
soft_count = 12
hard_count = 20

# ── Todo depth ─────────────────────────────────────────────────────────────
[todo]
enabled = true
soft_count = 25
hard_count = 50
# Also alert if todo is empty while baseline ship rate was healthy (starvation).
# This no longer waits for doing to reach zero: an empty queue is worth saying
# while the last cards are still in flight, because that is the only moment a
# refill can still keep the lanes busy.
empty_todo_with_baseline = true

# ── Supply runway ─────────────────────────────────────────────────────────
# The counts above catch a pile-up. They cannot catch the opposite failure,
# because depth without a rate says nothing: nine ready cards is eight hours of
# runway at 1 ship/hour and ninety minutes at 6. No constant is right for both.
#
# Measured 2026-09-06T03:21Z: `ready=9 todo=9 doing=3 ships_h=6`, and
# factory-health reported `factory=up` with no todo alert of any kind. The
# refill controller arms only below three ready cards and is capped at one card
# per 30-minute cooldown — about 2/hour against a 6/hour drain — so `ready=3` is
# one cooldown from empty and the refill lands at a third of the drain rate.
# The band between "the controller has not armed yet" and "the queue is empty"
# had no instrument in it.
#
# Reads pickup_ready, not todo: a todo card the lanes cannot claim is not
# supply, and pickup_ready is the number the controller and the lanes both act
# on. Falls back to todo when the board CLI reports no ready count. Stays silent
# below ship_rate.min_baseline_mean — an idle factory has no runway problem,
# only an idle one, and ship_rate_* already owns that.
runway_enabled = true
runway_soft_hours = 2.0
runway_hard_hours = 1.0
# Soft waits for two consecutive observations so one busy hour cannot page.
# Hard does not wait: under an hour of runway is urgent on a single reading.
runway_soft_streak = 2
runway_hard_streak = 1

# ── Pickup-ready buffer ───────────────────────────────────────────────────
# The 30-minute controller acts below three ready cards. Alert only after the
# ready count stays at zero for one hour and milestone gap-report still names a
# safe promote or decompose action.
[ready_buffer]
enabled = true
zero_alert_after_s = 3600

# ── Backlog black hole ─────────────────────────────────────────────────────
# A card that is Kind:pr, ungated (block_status none), dependency-free AND
# milestone-less cannot enter default/todo — fkanban's live-PR milestone gate
# refuses it — so nothing will ever pick it up. It is not parked on purpose and
# no other check reports it: ship rate stays plausible, todo depth looks merely
# thin, and the work is simply invisible.
#
# Measured 2026-08-08: the board sat at `pickup-ready: 2 of 78` with 21 such
# cards, the oldest three days old. Nothing alerted, because nothing was
# looking. This band is that missing instrument.
#
# soft_count = 1 on purpose. The healthy value is zero: every one of these is a
# card someone filed believing it would be worked.
[backlog]
enabled = true
soft_count = 1
hard_count = 10
# Ignore cards younger than this — a filer stamping a milestone seconds later is
# the normal flow, not a black hole.
min_age_h = 3.0

# ── 24h ship volume ────────────────────────────────────────────────────────
# Ships in last 24h vs previous 24h (needs history ring; optional soft only).
[ship_volume]
enabled = true
soft_ratio = 0.50
hard_ratio = 0.25
# Need this many prior samples in the ring before relative volume fires.
min_history_points = 6

# ── Install freshness (Last Stack self-upgrade gate) ───────────────────────
# Detects the factory-freeze where pickup noops on stale-last-stack-install
# while todo is non-empty and doing is empty — or update-check says behind.
[install]
enabled = true
# Soft when update-check reports GIT_UPDATE_AVAILABLE / UPGRADE_AVAILABLE.
soft_when_behind = true
# Soft when recent pickup heartbeats show N+ consecutive stale-install noops
# and todo>0 with doing==0.
heartbeat_stale_soft = 3
# Hard when consecutive stale-install noops >= this (or behind + empty doing + todo>0).
heartbeat_stale_hard = 6
# How far back in routine-heartbeats.log to scan (lines).
heartbeat_scan_lines = 200

# ── Closeout / pipeline smell ──────────────────────────────────────────────
[closeout]
enabled = true
# doing cards with pr_url older than this (hours) → suggest board-closeout.
merged_suspect_age_h = 1.5
