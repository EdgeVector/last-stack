# Example: Brain ci-required.yml with /v2 DEV publishing integration
#
# This is a reference implementation showing how EdgeVector/brain should integrate
# the /v2 DEV publish workflow. Copy the `publish-v2-dev` job to Brain's actual
# .github/workflows/ci-required.yml.

name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: ci.sh (syntax, install, typecheck)
        run: bash .lastgit/ci.sh

  build-mcp-binary:
    name: build-mcp-binary
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile + sign fbrain-mcp
        run: bun run build:mcp

      - name: Verify signature matches manifest bundle id
        run: |
          codesign -dv dist/fbrain-mcp 2>&1 | tee /tmp/codesign.txt
          grep -q 'Identifier=com.edgevector.fbrain' /tmp/codesign.txt
          codesign --verify --verbose dist/fbrain-mcp

      - name: Smoke-test the compiled MCP surface
        run: |
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./dist/fbrain-mcp 2>/tmp/mcp-stderr.log > /tmp/mcp-out.txt
          cat /tmp/mcp-stderr.log
          n=$(bun -e 'const ls=require("fs").readFileSync("/tmp/mcp-out.txt","utf8").trim().split("\n"); const r=JSON.parse(ls[1]); const names=r.result.tools.map(t=>t.name); console.log(names.join(",")); process.stderr.write(String(names.length));' 2>/tmp/mcp-count.txt)
          echo "tools: $n"
          expected=$(bun -e 'import { FBRAIN_MCP_TOOL_NAMES } from "./src/mcp/tools.ts"; process.stdout.write(String(FBRAIN_MCP_TOOL_NAMES.length));')
          test "$(cat /tmp/mcp-count.txt)" = "$expected"

      - name: Upload fbrain-mcp artifact
        uses: actions/upload-artifact@v4
        with:
          name: fbrain-mcp
          path: dist/fbrain-mcp
          if-no-files-found: error

  ci-required:
    name: ci-required
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        run: |
          echo "check=${{ needs.check.result }}"
          test "${{ needs.check.result }}" = "success"

  # Existing publish job - builds and uploads GitHub Actions artifact
  publish:
    name: publish
    needs: [ci-required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: EdgeVector/last-stack/.github/workflows/host-track-artifact.yml@main
    with:
      config: .lastgit/artifacts.json

  # NEW: Publish to /v2 DEV app registry
  # This job downloads the artifact from `publish` and publishes it to the
  # /v2 DEV registry using the lastdb CLI. DEV only - never runs on prod.
  publish-v2-dev:
    name: publish to /v2 dev
    needs: [ci-required, publish]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
    uses: EdgeVector/last-stack/.github/workflows/publish-app-v2-dev.yml@main
    with:
      app-id: brain
      artifact-name: ht-artifact-${{ github.sha }}
      manifest-path: brain/lastdb-app.json
    secrets:
      LASTDB_API_KEY: ${{ secrets.LASTDB_API_KEY }}
      APP_PUBLISHER_KEY_BASE64: ${{ secrets.BRAIN_PUBLISHER_KEY_BASE64 }}
