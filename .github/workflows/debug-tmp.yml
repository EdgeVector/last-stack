name: debug-tmp
on:
  pull_request:
    branches: [main]
jobs:
  dbg:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bash .github/scripts/ci-toolchain.sh
      - name: dogfood isolate
        continue-on-error: true
        run: |
          LAST_STACK_DOGFOOD_MIN_FREE_MIB=0 LAST_STACK_DOGFOOD_SKIP_PRIMARY_CHECK=1 LAST_STACK_DOGFOOD_MAX_LOAD_PER_CPU=999 LAST_STACK_DOGFOOD_OFFHOST_CMD=true bash -x bin/last-stack-dogfood-resource-isolate --preflight-only 2>&1 | tail -40
      - name: hooks guards
        continue-on-error: true
        run: bash tests/last-stack-hooks-guards.sh 2>&1 | tail -30
      - name: fqdn timing
        continue-on-error: true
        run: |
          hostname; time python3 -c "import socket; print(socket.getfqdn('127.0.0.1'))"
      - name: mock timing
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          cat > m.py <<'PY'
          import sys, time
          t0=time.time()
          from http.server import BaseHTTPRequestHandler, HTTPServer
          print("import", time.time()-t0, file=sys.stderr)
          httpd = HTTPServer(("127.0.0.1", 0), BaseHTTPRequestHandler)
          print("bind", time.time()-t0, file=sys.stderr)
          open(sys.argv[1], "w").write(str(httpd.server_address[1]))
          print("wrote", time.time()-t0, file=sys.stderr)
          httpd.serve_forever()
          PY
          sed -i '' 's/^          //' m.py
          ( time python3 m.py port.txt ) 2>&1 &
          for i in $(seq 1 100); do [ -s port.txt ] && break; sleep 0.1; done; echo waited=$i; cat port.txt; kill %1 || true
      - name: superseded -x
        continue-on-error: true
        run: bash -x tests/last-stack-ci-superseded.sh 2>&1 | tail -60
      - name: env
        run: |
          echo "SHELL=$SHELL"; which bash python3; bash --version | head -1; python3 --version; sw_vers
