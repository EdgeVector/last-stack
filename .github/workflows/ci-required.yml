# Gate of record for EdgeVector/last-stack (GitHub, since 2026-09-30).
# Brain: decision-2026-09-29-retire-lastgit-all-repos-to-github,
# sop-migrate-repo-to-github, sop-github-artifact-app-migration.
#
# The repo carries no tests (deleted 2026-10-09, Tom). The `lint` job runs
# .lastgit/ci.sh (bash -n plus the global lint passes), and the final job
# `ci-required` (the required check name) fails unless it passes.
# Runner: macos-latest, like the former Forge lane.
name: ci-required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Preserve main validation runs. Registry publication binds a checked source commit.
concurrency:
  group: ci-required-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"

jobs:
  lint:
    name: lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Lint toolchain
        run: bash .github/scripts/ci-toolchain.sh
      - name: bash -n and global lint passes
        run: bash .lastgit/ci.sh

  ci-required:
    name: ci-required
    needs: [lint]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every needed job must succeed
        env:
          LINT: ${{ needs.lint.result }}
        run: |
          echo "lint=$LINT"
          [ "$LINT" = "success" ]
