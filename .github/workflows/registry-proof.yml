# Registry proof, phases 1 to 3, in the public last-stack repo. Brain:
# design-registry-proof-in-github-ci-20260930,
# decision-2026-09-30-registry-proof-ci-sign-on-mac-gh-pat-build-in-last-stack.
#
# Shape (phase 3):
#   plan    ubuntu, seconds. Reads the `next` index, picks the target lastdb
#           build, reads the app heads (green ci-required + published
#           artifact), and decides whether any head moved past the pin that
#           `next` holds for that build. Nothing moved, or this exact head set
#           was already proved: stop here (the cheap no-op path).
#   proof   macOS arm64. Builds the exact lastdb oid inside this public repo
#           (the org GH_PAT only checks out the private fold repo), asserts the
#           build string, runs the isolated install smoke, and uploads ONE
#           proof bundle: verdicts, candidate set with shas, oids, versions,
#           timings. Never a binary, never a cache of a build directory.
#   report  ubuntu. A RED opens or updates ONE GitHub issue per build (dedupe by
#           title); a GREEN closes it.
#
# This workflow does NOT sign and does NOT open a tap PR. The registry signing
# key stays on Tom's Mac (decision D1). The Mac command
# bin/last-stack-registry-apply-proof downloads the bundle, verifies the run,
# signs with the local key and opens the tap PR.
#
# Triggers: every 30 minutes, and workflow_dispatch. A dispatch with an explicit
# fold_oid, lastdb_release or probe_only runs exactly that (phases 1 and 2). A
# dispatch with none of them plans like the schedule; `force` skips the "head
# moved" and "already proved" holds.
#
# Secrets: only the existing org secret GH_PAT. The plan job uses it only to
# resolve the short oid of the build to a full fold oid when a proof will run;
# the proof job passes it to actions/checkout and one presence probe. It is
# never echoed and never reaches the build or the smoke.
name: registry-proof

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      lastdb_release:
        description: "EdgeVector/homebrew-lastdb release tag (empty = plan from the registry)"
        required: false
        default: ""
        type: string
      fold_oid:
        description: "Build lastdb/lastdbd from EdgeVector/fold at this full 40-hex oid (private; needs GH_PAT). Empty = plan from the registry."
        required: false
        default: ""
        type: string
      lastdb_build:
        description: "Expected lastdbd --version build string for a fold_oid build (for example 0.23.3-2378-gbe41e547e). Empty = no extra check."
        required: false
        default: ""
        type: string
      probe_only:
        description: "Only run the preflight probes (brew prefix, GH_PAT presence, fold access). No build, no smoke."
        required: false
        default: false
        type: boolean
      force:
        description: "Planned run only: prove even when no app head moved or this head set was already proved."
        required: false
        default: false
        type: boolean

# One proof at a time. A pending run replaces an older pending run: every run
# re-reads the heads, so the newest pending run is the right one.
concurrency:
  group: registry-proof
  cancel-in-progress: false

permissions:
  contents: read

env:
  NO_COLOR: "1"
  FORCE_COLOR: "0"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run: ${{ steps.out.outputs.run }}
      mode: ${{ steps.out.outputs.mode }}
      reason: ${{ steps.out.outputs.reason }}
      fold_oid: ${{ steps.out.outputs.fold_oid }}
      lastdb_build: ${{ steps.out.outputs.lastdb_build }}
      lastdb_release: ${{ steps.out.outputs.lastdb_release }}
      probe_only: ${{ steps.out.outputs.probe_only }}
      fingerprint: ${{ steps.out.outputs.fingerprint }}
      moved: ${{ steps.out.outputs.moved }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mode (explicit dispatch or planned)
        env:
          EVENT: ${{ github.event_name }}
          IN_RELEASE: ${{ inputs.lastdb_release }}
          IN_FOLD_OID: ${{ inputs.fold_oid }}
          IN_BUILD: ${{ inputs.lastdb_build }}
          IN_PROBE: ${{ inputs.probe_only }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          mode=auto
          if [ "$EVENT" = workflow_dispatch ] && { [ -n "$IN_RELEASE" ] || [ -n "$IN_FOLD_OID" ] || [ "$IN_PROBE" = true ]; }; then
            mode=explicit
          fi
          {
            echo "PLAN_MODE=$mode"
            echo "PLAN_FORCE=${IN_FORCE:-false}"
            echo "PLAN_RUN=false"
            echo "PLAN_REASON=unset"
            echo "PLAN_FOLD_OID=$IN_FOLD_OID"
            echo "PLAN_BUILD=$IN_BUILD"
            echo "PLAN_RELEASE=$IN_RELEASE"
            echo "PLAN_PROBE=${IN_PROBE:-false}"
            echo "PLAN_FP="
            echo "PLAN_MOVED="
          } >> "$GITHUB_ENV"
          if [ "$mode" = explicit ]; then
            echo "PLAN_RUN=true" >> "$GITHUB_ENV"
            echo "PLAN_REASON=explicit dispatch inputs" >> "$GITHUB_ENV"
          fi
          echo "mode=$mode"

      - name: Read the next index and pick the target build
        if: ${{ env.PLAN_MODE == 'auto' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The contents API, not raw.githubusercontent.com: no CDN delay.
          gh api repos/EdgeVector/homebrew-lastdb/contents/registry/next.json \
            -H 'Accept: application/vnd.github.raw' > "$RUNNER_TEMP/next.json"
          bin/last-stack-registry-proof-plan select-build --index "$RUNNER_TEMP/next.json" \
            --override config/registry/proof-builds.json > "$RUNNER_TEMP/target.json"
          cat "$RUNNER_TEMP/target.json"
          {
            echo "PLAN_BUILD=$(jq -r .build "$RUNNER_TEMP/target.json")"
            echo "PLAN_FOLD_OID=$(jq -r .fold_oid "$RUNNER_TEMP/target.json")"
          } >> "$GITHUB_ENV"

      - name: App heads (green ci-required and a published artifact)
        if: ${{ env.PLAN_MODE == 'auto' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No lastdbd on this runner: the build string stands in for it. No
          # package.json fetch and no clone probe: heads only.
          bin/last-stack-canary-candidate-set \
            --lastdb-build "$PLAN_BUILD" \
            --source-venue github --sha-source github-ci \
            --no-version-lookup --no-source-probe \
            --out "$RUNNER_TEMP/heads.json"
          bin/last-stack-registry-proof-plan moved --index "$RUNNER_TEMP/next.json" \
            --build "$PLAN_BUILD" --heads "$RUNNER_TEMP/heads.json" > "$RUNNER_TEMP/moved.json"
          cat "$RUNNER_TEMP/moved.json"
          {
            echo "PLAN_FP=$(jq -r .fingerprint "$RUNNER_TEMP/moved.json")"
            echo "PLAN_MOVED=$(jq -r '.moved | join(",")' "$RUNNER_TEMP/moved.json")"
          } >> "$GITHUB_ENV"

      # A set that was proved (GREEN or RED) is not proved again until a head
      # moves: the proof job saves one tiny cache entry keyed by the fingerprint.
      # The entry holds a verdict word and a run id, nothing else.
      - name: Was this head set already proved?
        id: fpcache
        if: ${{ env.PLAN_MODE == 'auto' && env.PLAN_MOVED != '' }}
        uses: actions/cache/restore@v4
        with:
          path: fp-marker
          key: registry-proof-fp-${{ env.PLAN_FP }}
          lookup-only: true

      - name: Decide
        if: ${{ env.PLAN_MODE == 'auto' }}
        env:
          FP_HIT: ${{ steps.fpcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ -z "$PLAN_MOVED" ]; then
            reason="no-op: no app head moved past the pins next holds for $PLAN_BUILD"
            run=false
          elif [ "$PLAN_FORCE" = true ]; then
            reason="force: heads moved ($PLAN_MOVED), holds skipped"
            run=true
          elif [ "$FP_HIT" = true ]; then
            reason="no-op: this head set was already proved (fingerprint $PLAN_FP); waiting for a head to move"
            run=false
          else
            reason="heads moved: $PLAN_MOVED"
            run=true
          fi
          echo "PLAN_RUN=$run" >> "$GITHUB_ENV"
          echo "PLAN_REASON=$reason" >> "$GITHUB_ENV"
          echo "$reason"

      - name: Resolve the fold oid of the target build (only when a proof will run)
        if: ${{ env.PLAN_MODE == 'auto' && env.PLAN_RUN == 'true' && env.PLAN_FOLD_OID == '' }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          [ -n "$GH_PAT" ] || { echo "::error::GH_PAT is not available; cannot resolve the fold oid"; exit 1; }
          abbrev="${PLAN_BUILD##*-g}"
          oid="$(GH_TOKEN="$GH_PAT" gh api "repos/EdgeVector/fold/commits/$abbrev" --jq .sha)"
          case "$oid" in
            "$abbrev"*) ;;
            *) echo "::error::fold commit $abbrev resolved to an unexpected oid"; exit 1 ;;
          esac
          [ "${#oid}" -eq 40 ] || { echo "::error::fold oid is not 40 hex"; exit 1; }
          echo "PLAN_FOLD_OID=$oid" >> "$GITHUB_ENV"
          echo "fold oid: $oid"

      - name: Outputs and summary
        id: out
        run: |
          set -euo pipefail
          {
            echo "run=$PLAN_RUN"
            echo "mode=$PLAN_MODE"
            echo "reason=$PLAN_REASON"
            echo "fold_oid=$PLAN_FOLD_OID"
            echo "lastdb_build=$PLAN_BUILD"
            echo "lastdb_release=$PLAN_RELEASE"
            echo "probe_only=$PLAN_PROBE"
            echo "fingerprint=$PLAN_FP"
            echo "moved=$PLAN_MOVED"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## registry-proof plan"
            echo
            echo "- mode: \`$PLAN_MODE\`"
            echo "- target build: \`${PLAN_BUILD:--}\`"
            echo "- moved apps: \`${PLAN_MOVED:--}\`"
            echo "- decision: **$PLAN_RUN** ($PLAN_REASON)"
          } >> "$GITHUB_STEP_SUMMARY"

  proof:
    name: proof
    needs: plan
    if: ${{ needs.plan.outputs.run == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Prepare proof bundle directory
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/registry-proof-bundle"
          SCRATCH="$RUNNER_TEMP/registry-proof-scratch"
          mkdir -p "$BUNDLE" "$SCRATCH"
          {
            echo "BUNDLE=$BUNDLE"
            echo "SCRATCH=$SCRATCH"
          } >> "$GITHUB_ENV"
          printf 'step\tseconds\trc\n' > "$BUNDLE/timings.tsv"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "uname=$(uname -a)"
            echo "sw_vers=$(sw_vers | tr '\n' ' ')"
            echo "cpus=$(sysctl -n hw.ncpu)"
            echo "mem_bytes=$(sysctl -n hw.memsize)"
            echo "disk_free_kb=$(df -k / | awk 'NR==2 {print $4}')"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$BUNDLE/runner.env"
          cat "$BUNDLE/runner.env"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Resolve the lastdb release tag
        env:
          INPUT_TAG: ${{ needs.plan.outputs.lastdb_release }}
          INPUT_FOLD_OID: ${{ needs.plan.outputs.fold_oid }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_FOLD_OID" ]; then
            echo "LASTDB_TAG=-" >> "$GITHUB_ENV"
            echo "LASTDB_SOURCE=built" >> "$GITHUB_ENV"
            echo "build mode: fold oid $INPUT_FOLD_OID"
            exit 0
          fi
          echo "LASTDB_SOURCE=release" >> "$GITHUB_ENV"
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            loc="$(curl -sS -o /dev/null -w '%{redirect_url}' https://github.com/EdgeVector/homebrew-lastdb/releases/latest)"
            tag="${loc##*/}"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "bad release tag: '$tag'" >&2; exit 1 ;;
          esac
          echo "LASTDB_TAG=$tag" >> "$GITHUB_ENV"
          echo "release tag: $tag"

      - name: brew install edgevector/lastdb/lastdb
        run: |
          set -euo pipefail
          t0=$SECONDS; rc=0
          # Current Homebrew refuses a formula from an untrusted third-party tap
          # (run 36764050149 failed here). Trust is a local setting on this
          # ephemeral runner; it is not a secret.
          { brew tap edgevector/lastdb && brew trust --tap edgevector/lastdb \
              && brew install edgevector/lastdb/lastdb; } || rc=$?
          printf 'brew-install\t%s\t%s\n' "$((SECONDS - t0))" "$rc" >> "$BUNDLE/timings.tsv"
          # Phase 1 listed the prefix WITHOUT a trailing slash and saw only the
          # symlink. List the target, the Cellar dir and the service files.
          bp="$(brew --prefix edgevector/lastdb/lastdb 2>/dev/null || true)"
          {
            brew --version > "$SCRATCH/brew-version.txt" 2>&1 || true
            echo "brew_version=$(head -1 "$SCRATCH/brew-version.txt")"
            echo "brew_prefix=$bp"
            echo "== ls -la <prefix>/"
            ls -la "$bp/" 2>&1
            echo "== find <prefix>/ maxdepth 2 (name, type)"
            find "$bp/" -maxdepth 2 -print 2>&1 | head -60
            echo "== service and plist files anywhere in the keg (maxdepth 4)"
            find "$bp/" -maxdepth 4 \( -name '*.plist' -o -name '*.service' -o -name '*lastdbd-service*' \) 2>&1 | head -20
            echo "== brew services list (read-only)"
            brew services list 2>&1 | head -10
            echo "== brew info --json=v2 service field"
            brew info --json=v2 edgevector/lastdb/lastdb 2>/dev/null | jq -c '.formulae[0] | {version: .installed[0].version, service: .service, caveats: (.caveats // "" | .[0:300])}' 2>&1
          } 2>&1 | sed 's#/Users/runner#~#g' > "$BUNDLE/brew-probe.txt"
          cat "$BUNDLE/brew-probe.txt"
          exit "$rc"

      - name: Preflight (GH_PAT presence, fold access)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FOLD_OID: ${{ needs.plan.outputs.fold_oid }}
          PROBE_ONLY: ${{ needs.plan.outputs.probe_only }}
        run: |
          set -u
          # Presence only. The value is never printed, and GH_TOKEN below is the
          # same masked value, used by gh for one read-only API call.
          if [ -n "$GH_PAT" ]; then pat=present; else pat=absent; fi
          {
            echo "gh_pat=$pat"
            if [ "$pat" = present ] && [ -n "$FOLD_OID" ]; then
              private="$(GH_TOKEN="$GH_PAT" gh api repos/EdgeVector/fold --jq .private 2>&1 | head -c 200)"
              echo "fold_private=$private"
              found="$(GH_TOKEN="$GH_PAT" gh api "repos/EdgeVector/fold/commits/$FOLD_OID" --jq .sha 2>&1 | head -c 200)"
              echo "fold_commit_visible=$([ "$found" = "$FOLD_OID" ] && echo yes || echo "no: $found")"
            fi
          } > "$BUNDLE/preflight.txt" 2>&1
          cat "$BUNDLE/preflight.txt"
          if [ -n "$FOLD_OID" ] && [ "$pat" != present ]; then
            echo "::error::GH_PAT is not available to this workflow; cannot check out private fold"
            exit 1
          fi
          if [ -n "$FOLD_OID" ] && [ "${PROBE_ONLY:-false}" != true ] && ! grep -q '^fold_commit_visible=yes' "$BUNDLE/preflight.txt"; then
            echo "::error::fold commit $FOLD_OID is not on GitHub fold (a Forgejo-only oid cannot be built in CI)"
            exit 1
          fi

      - name: Check out fold at the oid (private source)
        if: ${{ needs.plan.outputs.fold_oid != '' && needs.plan.outputs.probe_only != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: EdgeVector/fold
          ref: ${{ needs.plan.outputs.fold_oid }}
          token: ${{ secrets.GH_PAT }}
          path: fold-src
          fetch-depth: 0
          persist-credentials: false

      - name: Build lastdb and lastdbd from fold (no cache, no upload)
        if: ${{ needs.plan.outputs.fold_oid != '' && needs.plan.outputs.probe_only != 'true' }}
        env:
          FOLD_OID: ${{ needs.plan.outputs.fold_oid }}
          EXPECT_BUILD: ${{ needs.plan.outputs.lastdb_build }}
          # Match the release workflow: no rustc wrapper; never stamp from a ref name.
          RUSTC_WRAPPER: ""
          GITHUB_REF_NAME: ""
        run: |
          set -euo pipefail
          t0=$SECONDS; rc=0
          (
            set -euo pipefail
            cd "$GITHUB_WORKSPACE/fold-src"
            case "$FOLD_OID" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
              *) echo "fold_oid must be lowercase hex" >&2; exit 1 ;;
            esac
            [ "${#FOLD_OID}" -eq 40 ] || { echo "fold_oid must be a full 40-hex oid" >&2; exit 1; }
            head="$(git rev-parse HEAD)"
            [ "$head" = "$FOLD_OID" ] || { echo "checkout HEAD $head is not $FOLD_OID" >&2; exit 1; }
            # The Mac canary build used a 9-digit abbreviation; pin it so the
            # stamp is the same string for the same commit.
            git config core.abbrev 9
            [ -z "$(git status --porcelain)" ] || { echo "fold checkout is dirty" >&2; exit 1; }
            # build.rs stamps `git describe` with the leading v of the tag stripped.
            want="$(git describe --tags --long --abbrev=9)"
            want="${want#v}"
            echo "git describe: $want"
            if [ -n "$EXPECT_BUILD" ] && [ "$want" != "$EXPECT_BUILD" ]; then
              echo "git describe $want does not equal the expected build $EXPECT_BUILD" >&2
              exit 1
            fi
            echo "$want" > "$SCRATCH/expected-build.txt"
            bt0=$SECONDS
            cargo build --release -p lastdb_node --bin lastdb --bin lastdbd
            echo "cargo_build_seconds=$((SECONDS - bt0))" > "$BUNDLE/build.env"
            mkdir -p "$SCRATCH/bin"
            cp target/release/lastdb target/release/lastdbd "$SCRATCH/bin/"
            chmod +x "$SCRATCH/bin/lastdb" "$SCRATCH/bin/lastdbd"
            got="$("$SCRATCH/bin/lastdbd" --version | sed -n 's/^lastdbd //p' | head -1)"
            echo "lastdbd --version build: $got"
            # The stamp is git describe with the leading v stripped.
            [ "$got" = "$want" ] || { echo "lastdbd reports '$got', expected '$want'" >&2; exit 1; }
            "$SCRATCH/bin/lastdb" --version
            {
              echo "fold_oid=$FOLD_OID"
              echo "build=$got"
              echo "rustc=$(rustc --version)"
              echo "binary_sha256_lastdbd=$(shasum -a 256 "$SCRATCH/bin/lastdbd" | awk '{print $1}')"
              echo "binary_bytes_lastdbd=$(stat -f %z "$SCRATCH/bin/lastdbd")"
            } >> "$BUNDLE/build.env"
          ) || rc=$?
          printf 'fold-build\t%s\t%s\n' "$((SECONDS - t0))" "$rc" >> "$BUNDLE/timings.tsv"
          # Drop the private source tree and the build dir before the smoke so
          # the smoke runs with the memory and disk it had in phase 1.
          rm -rf "$GITHUB_WORKSPACE/fold-src/target" "$GITHUB_WORKSPACE/fold-src"
          exit "$rc"

      - name: Download the release binaries into the scratch dir
        if: ${{ needs.plan.outputs.fold_oid == '' && needs.plan.outputs.probe_only != 'true' }}
        run: |
          set -euo pipefail
          t0=$SECONDS; rc=0
          (
            set -euo pipefail
            base="https://github.com/EdgeVector/homebrew-lastdb/releases/download/$LASTDB_TAG"
            dl="$SCRATCH/dl"
            mkdir -p "$dl" "$SCRATCH/bin"
            curl -fsSL -o "$dl/lastdb-aarch64-apple-darwin.tar.gz" "$base/lastdb-aarch64-apple-darwin.tar.gz"
            curl -fsSL -o "$dl/manifest.json" "$base/lastdb-aarch64-apple-darwin.manifest.json"
            want="$(jq -r '.artifact.sha256' "$dl/manifest.json")"
            got="$(shasum -a 256 "$dl/lastdb-aarch64-apple-darwin.tar.gz" | awk '{print $1}')"
            [ "$want" = "$got" ] || { echo "tarball sha256 mismatch" >&2; exit 1; }
            tar -xzf "$dl/lastdb-aarch64-apple-darwin.tar.gz" -C "$dl"
            for b in lastdb lastdbd; do
              src="$(find "$dl" -maxdepth 3 -type f -name "$b" | head -1)"
              [ -n "$src" ] || { echo "missing $b in tarball" >&2; exit 1; }
              cp "$src" "$SCRATCH/bin/$b"
              chmod +x "$SCRATCH/bin/$b"
            done
            "$SCRATCH/bin/lastdbd" --version
            "$SCRATCH/bin/lastdb" --version
            cp "$dl/manifest.json" "$BUNDLE/release-manifest.json"
          ) || rc=$?
          printf 'download-binaries\t%s\t%s\n' "$((SECONDS - t0))" "$rc" >> "$BUNDLE/timings.tsv"
          exit "$rc"

      - name: Candidate set
        if: ${{ needs.plan.outputs.probe_only != 'true' }}
        env:
          FOLD_OID: ${{ needs.plan.outputs.fold_oid }}
          # Built-in job token: reads the public app repos' check runs and artifacts.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t0=$SECONDS; rc=0
          # The real source oid of the lastdb build: the fold commit that was
          # built, or the release manifest's source_git_oid.
          if [ -n "$FOLD_OID" ]; then
            oid_args=(--lastdb-oid "$FOLD_OID")
          else
            oid_args=(--lastdb-manifest "$SCRATCH/dl/manifest.json")
          fi
          bin/last-stack-canary-candidate-set \
            --lastdbd "$SCRATCH/bin/lastdbd" \
            "${oid_args[@]}" \
            --source-venue github \
            --sha-source github-ci \
            --out "$SCRATCH/candidate-set.json" || rc=$?
          printf 'candidate-set\t%s\t%s\n' "$((SECONDS - t0))" "$rc" >> "$BUNDLE/timings.tsv"
          [ "$rc" -eq 0 ] || exit "$rc"
          cp "$SCRATCH/candidate-set.json" "$BUNDLE/candidate-set.json"
          jq -r '.apps | to_entries[]? | [.key, (.value.sha // "-")[0:9], (.value.sha_source // "-"), (.value.source_reachable // "-" | tostring)] | @tsv' \
            "$SCRATCH/candidate-set.json" || true

      - name: Runner probes (Schema Service, launchctl)
        if: ${{ needs.plan.outputs.probe_only != 'true' }}
        run: |
          set -u
          t0=$SECONDS
          p="$BUNDLE/probes.txt"
          {
            echo "== launchctl gui domain"
            launchctl print "gui/$(id -u)" >/dev/null 2>&1 && echo "gui_domain=ok" || echo "gui_domain=fail rc=$?"
            echo "== launchctl user domain"
            launchctl print "user/$(id -u)" >/dev/null 2>&1 && echo "user_domain=ok" || echo "user_domain=fail rc=$?"
            echo "== LaunchAgents dir"
            ls -ld "$HOME/Library/LaunchAgents" 2>&1 || true
            echo "== egress IP class (no address recorded)"
            curl -sS -m 10 -o /dev/null -w 'github_api_http=%{http_code}\n' https://api.github.com/ || echo "github_api_http=fail"
          } > "$p" 2>&1
          cat "$p"
          printf 'probes\t%s\t0\n' "$((SECONDS - t0))" >> "$BUNDLE/timings.tsv"

      - name: Isolated llms.txt install smoke
        if: ${{ needs.plan.outputs.probe_only != 'true' }}
        run: |
          set -u
          set +e   # a RED smoke exits 1; keep going so the bundle is written
          t0=$SECONDS
          # Memory sampler: system used memory and the sum of all process RSS,
          # every 5 s, for the whole smoke.
          mem="$BUNDLE/memory-samples.tsv"
          printf 'epoch\tused_mb\trss_sum_mb\tswap_used\n' > "$mem"
          (
            while :; do
              ps_kb="$(vm_stat | awk '/page size of/ {gsub(/[^0-9]/,"",$8); ps=$8} /Pages active/ {a=$3} /Pages wired down/ {w=$4} /occupied by compressor/ {c=$5} END {gsub(/\./,"",a); gsub(/\./,"",w); gsub(/\./,"",c); printf "%d", (a+w+c)*ps/1048576}')"
              rss="$(ps -axo rss= | awk '{s+=$1} END {printf "%d", s/1024}')"
              swap="$(sysctl -n vm.swapusage | awk '{print $6}')"
              printf '%s\t%s\t%s\t%s\n' "$(date +%s)" "$ps_kb" "$rss" "$swap" >> "$mem"
              sleep 5
            done
          ) &
          sampler=$!

          SMOKE_LASTDBD_BIN="$SCRATCH/bin/lastdbd" \
          SMOKE_CANDIDATE_SET="$SCRATCH/candidate-set.json" \
          SMOKE_TOTAL_BUDGET_SECS=1800 \
          SMOKE_NO_FORGE_AUTH=1 \
          SMOKE_BREW_PLIST_NAME=sh.brew.lastdb.plist \
            bash skills/llms-txt-install-smoke/run.sh --json --keep \
              > "$SCRATCH/proof.stdout" 2> "$BUNDLE/smoke.stderr.log"
          rc=$?
          kill "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          printf 'smoke\t%s\t%s\n' "$((SECONDS - t0))" "$rc" >> "$BUNDLE/timings.tsv"
          echo "SMOKE_RC=$rc" >> "$GITHUB_ENV"
          # The JSON verdict is the last stdout line that starts with '{'.
          grep '^{' "$SCRATCH/proof.stdout" | tail -1 > "$BUNDLE/proof.json" || true
          [ -s "$BUNDLE/proof.json" ] || echo '{"verdict":"RED","fails":["no-json-from-smoke"]}' > "$BUNDLE/proof.json"
          cat "$BUNDLE/proof.json"
          exit 0

      - name: Collect smoke log, step times and search-init size
        if: ${{ always() && needs.plan.outputs.probe_only != 'true' }}
        run: |
          set -u
          sandbox="$(jq -r '.sandbox // empty' "$BUNDLE/proof.json" 2>/dev/null || true)"
          if [ -z "$sandbox" ]; then
            sandbox="$(ls -dt /tmp/llms-txt-install-smoke.* 2>/dev/null | head -1 || true)"
          fi
          {
            echo "sandbox_present=$([ -n "$sandbox" ] && [ -d "$sandbox" ] && echo yes || echo no)"
          } > "$BUNDLE/sandbox.txt"
          if [ -n "$sandbox" ] && [ -d "$sandbox" ]; then
            # Log: scrub anything that looks like a token before it is uploaded.
            if [ -f "$sandbox/run.log" ]; then
              sed -E 's/(gh[pousr]_[A-Za-z0-9]{20,})/[scrubbed]/g; s/(Authorization:[[:space:]]*[A-Za-z]+[[:space:]]+)[^[:space:]]+/\1[scrubbed]/g' \
                "$sandbox/run.log" > "$BUNDLE/smoke.run.log"
              grep '>>>' "$sandbox/run.log" > "$BUNDLE/smoke-steps.txt" || true
              grep -i -E 'launchctl|LaunchAgents' "$sandbox/run.log" | head -40 > "$BUNDLE/smoke-launchctl-lines.txt" || true
              grep -i -E 'model|download|huggingface|onnx|embedding' "$sandbox/run.log" | head -40 > "$BUNDLE/smoke-model-lines.txt" || true
            fi
            {
              echo "== sandbox total (KB)"
              du -sk "$sandbox" 2>/dev/null | awk '{print $1}'
              echo "== largest directories, depth 5 (KB path)"
              du -k -d 5 "$sandbox" 2>/dev/null | sort -rn | head -25 | sed "s#$sandbox#<sandbox>#"
              echo "== dirs whose name looks like a model or cache"
              find "$sandbox" -maxdepth 7 -type d \( -iname '*model*' -o -iname '*onnx*' -o -iname '*huggingface*' -o -iname '.cache' \) 2>/dev/null | head -20 | while read -r d; do
                printf '%s\t%s\n' "$(du -sk "$d" 2>/dev/null | awk '{print $1}')" "${d#"$sandbox"}"
              done
            } >> "$BUNDLE/sandbox.txt"
          fi
          cat "$BUNDLE/sandbox.txt"

      - name: Attribution and job summary
        if: ${{ always() && needs.plan.outputs.probe_only != 'true' }}
        env:
          INPUT_FOLD_OID: ${{ needs.plan.outputs.fold_oid }}
          INPUT_LASTDB_BUILD: ${{ needs.plan.outputs.lastdb_build }}
        run: |
          set -u
          # An earlier step can fail before the smoke runs. Say so in the verdict
          # instead of failing this step on a missing proof file.
          if [ ! -s "$BUNDLE/proof.json" ]; then
            failed="$(awk -F'\t' 'NR>1 && $3!=0 {print $1; exit}' "$BUNDLE/timings.tsv")"
            if [ -z "$failed" ] && grep -q '^fold_commit_visible=no' "$BUNDLE/preflight.txt" 2>/dev/null; then
              failed="fold-oid-not-on-github"
            elif [ -z "$failed" ] && grep -q '^gh_pat=absent' "$BUNDLE/preflight.txt" 2>/dev/null; then
              failed="gh-pat-absent"
            fi
            jq -n --arg s "${failed:-unknown-before-smoke}" '{verdict:"RED",fails:["runner-setup:"+$s]}' > "$BUNDLE/proof.json"
          fi
          # Every verdict, RED as well as GREEN, names the build it judged: the
          # build string the binary reports, the source oid, and where the
          # binary came from. Verdicts, oids, versions and timings only.
          rb=""
          [ -x "$SCRATCH/bin/lastdbd" ] && rb="$("$SCRATCH/bin/lastdbd" --version 2>/dev/null | sed -n 's/^lastdbd //p' | head -1)"
          co=""
          [ -s "$SCRATCH/candidate-set.json" ] && co="$(jq -r '.lastdb.oid // ""' "$SCRATCH/candidate-set.json")"
          cosrc=""
          [ -s "$SCRATCH/candidate-set.json" ] && cosrc="$(jq -r '.lastdb.oid_source // ""' "$SCRATCH/candidate-set.json")"
          cbuild="$(awk -F= '$1=="cargo_build_seconds" {print $2}' "$BUNDLE/build.env" 2>/dev/null || true)"
          jq --arg b "$rb" --arg o "$co" --arg os "$cosrc" --arg src "${LASTDB_SOURCE:-unknown}" \
             --arg tag "${LASTDB_TAG:--}" --arg fold "${INPUT_FOLD_OID:-}" \
             --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
             --arg sha "$GITHUB_SHA" --arg cb "${cbuild:-}" --arg eb "${INPUT_LASTDB_BUILD:-}" \
             '. + {lastdb_build: (if (.lastdb_build // "") != "" then .lastdb_build else $b end),
                   lastdb_oid: (if (.lastdb_oid // "") != "" then .lastdb_oid else $o end),
                   lastdb_oid_source: $os, lastdb_source: $src, lastdb_release_tag: $tag,
                   fold_oid: $fold, lastdb_build_expected: $eb, workflow_run: $run, last_stack_sha: $sha,
                   cargo_build_seconds: (if $cb == "" then null else ($cb | tonumber) end)}' \
             "$BUNDLE/proof.json" > "$BUNDLE/proof.json.new" && mv "$BUNDLE/proof.json.new" "$BUNDLE/proof.json"
          bin/last-stack-registry-red-attribution --proof "$BUNDLE/proof.json" > "$BUNDLE/attribution.txt" 2> "$BUNDLE/attribution.err"
          echo "attribution rc=$?"
          cat "$BUNDLE/attribution.txt"

          verdict="$(jq -r '.verdict // "UNKNOWN"' "$BUNDLE/proof.json")"
          build="$(jq -r '.lastdb_build // "-"' "$BUNDLE/proof.json")"
          peak_used="$(awk -F'\t' 'NR>1 && $2+0>m {m=$2+0} END {print m+0}' "$BUNDLE/memory-samples.tsv" 2>/dev/null || true)"
          peak_rss="$(awk -F'\t' 'NR>1 && $3+0>m {m=$3+0} END {print m+0}' "$BUNDLE/memory-samples.tsv" 2>/dev/null || true)"
          {
            echo "verdict=$verdict"
            echo "lastdb_tag=$LASTDB_TAG"
            echo "lastdb_build=$build"
            echo "peak_used_mb=$peak_used"
            echo "peak_rss_sum_mb=$peak_rss"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$BUNDLE/summary.env"

          {
            echo "## registry-proof"
            echo
            echo "- verdict: **$verdict**"
            echo "- lastdb source: \`${LASTDB_SOURCE:-unknown}\`, release tag: \`$LASTDB_TAG\`, build: \`$build\`"
            echo "- lastdb oid: \`$(jq -r '.lastdb_oid // "-"' "$BUNDLE/proof.json")\` (\`$(jq -r '.lastdb_oid_source // "-"' "$BUNDLE/proof.json")\`)"
            [ -n "$INPUT_FOLD_OID" ] && echo "- fold oid built: \`$INPUT_FOLD_OID\`"
            echo "- peak memory: used ${peak_used} MB, process RSS sum ${peak_rss} MB"
            echo
            echo "### Wall time per step"
            echo
            echo '| step | seconds | rc |'
            echo '|---|---|---|'
            awk -F'\t' 'NR>1 {printf "| %s | %s | %s |\n", $1, $2, $3}' "$BUNDLE/timings.tsv"
            echo
            echo "### Fails"
            echo
            fails="$(jq -r '(.fails // [])[]' "$BUNDLE/proof.json" 2>/dev/null || true)"
            if [ -n "$fails" ]; then
              echo '```'
              printf '%s\n' "$fails"
              echo '```'
            else
              echo "none"
            fi
            echo
            echo "### Attribution"
            echo '```'
            cat "$BUNDLE/attribution.txt"
            echo '```'
            echo
            echo "### Runner probes"
            echo '```'
            cat "$BUNDLE/probes.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the bundle manifest (apply.json)
        if: ${{ always() && needs.plan.outputs.probe_only != 'true' }}
        env:
          PLAN_MOVED_OUT: ${{ needs.plan.outputs.moved }}
          PLAN_FP_OUT: ${{ needs.plan.outputs.fingerprint }}
        run: |
          set -u
          [ -s "$BUNDLE/proof.json" ] || exit 0
          [ -f "$BUNDLE/attribution.txt" ] || printf 'verdict=RED\nshared_fail=1\npassed_apps=\nfailed_apps=\n' > "$BUNDLE/attribution.txt"
          # Everything the Mac apply command needs and checks: verdict, per-app
          # attribution, candidate shas, lastdb build and oid, run id and URL,
          # proof record name, file digests. Verdicts and ids only: no binary.
          bin/last-stack-registry-proof-plan manifest --bundle "$BUNDLE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --event "$GITHUB_EVENT_NAME" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --moved "$PLAN_MOVED_OUT" --fingerprint "$PLAN_FP_OUT"
          jq -c '{run_id, verdict, shared_fail, failed_apps, passed_apps, proof_run, lastdb}' "$BUNDLE/apply.json"

      - name: Mark this head set as proved
        if: ${{ always() && needs.plan.outputs.probe_only != 'true' }}
        run: |
          set -u
          [ -s "$SCRATCH/candidate-set.json" ] || exit 0
          [ -s "$BUNDLE/proof.json" ] || exit 0
          # A runner-setup RED says nothing about the heads, so it is retried on
          # the next schedule. A smoke verdict (GREEN, or RED with named fails)
          # holds until a head moves.
          if jq -e '(.fails // []) | map(startswith("runner-setup:")) | any' "$BUNDLE/proof.json" >/dev/null 2>&1; then
            echo "runner-setup RED: no marker"
            exit 0
          fi
          fp="$(bin/last-stack-registry-proof-plan fingerprint --candidate-set "$SCRATCH/candidate-set.json" | jq -r .fingerprint)"
          mkdir -p fp-marker
          printf '%s run=%s\n' "$(jq -r '.verdict // "UNKNOWN"' "$BUNDLE/proof.json")" "$GITHUB_RUN_ID" > fp-marker/marker.txt
          echo "MARK_FP=$fp" >> "$GITHUB_ENV"
          echo "marker fingerprint: $fp"

      - name: Save the head-set marker (verdict word and run id only)
        if: ${{ always() && env.MARK_FP != '' }}
        uses: actions/cache/save@v4
        with:
          path: fp-marker
          key: registry-proof-fp-${{ env.MARK_FP }}

      - name: Upload proof bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: registry-proof-bundle-${{ github.run_id }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail the job when the smoke is RED
        if: ${{ always() && needs.plan.outputs.probe_only != 'true' }}
        run: |
          verdict="$(jq -r '.verdict // "UNKNOWN"' "$BUNDLE/proof.json" 2>/dev/null || echo UNKNOWN)"
          echo "verdict=$verdict smoke_rc=${SMOKE_RC:-unset}"
          [ "$verdict" = "GREEN" ]

  report:
    name: report
    needs: [plan, proof]
    if: ${{ always() && needs.proof.result != 'skipped' && needs.plan.outputs.probe_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the proof bundle
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: registry-proof-bundle-${{ github.run_id }}
          path: bundle

      - name: One issue per RED build (opened or updated); a GREEN closes it
        if: ${{ steps.dl.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build="$(jq -r '.lastdb_build // empty' bundle/proof.json)"
          [ -n "$build" ] || build="$(jq -r '.lastdb_build_expected // empty' bundle/proof.json)"
          [ -n "$build" ] || build=unknown
          bin/last-stack-registry-proof-red-issue --repo "$GITHUB_REPOSITORY" --build "$build" \
            --proof bundle/proof.json --attribution bundle/attribution.txt \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
