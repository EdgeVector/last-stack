# Reusable workflow: publish an app release to /v2 DEV app registry.
#
# Caller (a per-repo `publish-v2-dev` job, push to main only, after artifact build):
#
#   publish-v2-dev:
#     needs: [ci-required, publish]
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     permissions: { contents: read, actions: read }
#     uses: EdgeVector/last-stack/.github/workflows/publish-app-v2-dev.yml@main
#     with:
#       app-id: brain
#       artifact-name: ht-artifact-${{ github.sha }}
#       manifest-path: brain/lastdb-app.json
#     secrets:
#       LASTDB_API_KEY: ${{ secrets.LASTDB_API_KEY }}
#       APP_PUBLISHER_KEY_BASE64: ${{ secrets.BRAIN_PUBLISHER_KEY_BASE64 }}
#
# This downloads the artifact built by host-track-artifact.yml, constructs a release,
# and publishes it to the /v2 DEV registry using the lastdb CLI. The signing key must
# match the app's registered owner_dev_pubkey in the /v2 registry.
#
# DEV only. Never runs on prod registry. The environment is hardcoded to dev.
name: publish-app-v2-dev

on:
  workflow_call:
    inputs:
      app-id:
        description: App ID registered in /v2 (e.g. 'brain', 'lastsecrets', 'lastseek')
        type: string
        required: true
      artifact-name:
        description: GitHub Actions artifact name containing the built app (e.g. ht-artifact-${{ github.sha }})
        type: string
        required: true
      manifest-path:
        description: Path to the app manifest JSON within the artifact (e.g. 'brain/lastdb-app.json')
        type: string
        required: true
      lastdb-ref:
        description: lastdb repo ref that supplies the CLI
        type: string
        default: main
    secrets:
      LASTDB_API_KEY:
        description: Developer API key for /v2 registry authentication
        required: true
      APP_PUBLISHER_KEY_BASE64:
        description: Ed25519 signing key for app release signing (base64-encoded private key)
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: publish to /v2 dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEV_REGISTRY_URL: https://y0q3m6vk75.execute-api.us-west-2.amazonaws.com
    steps:
      - name: Checkout lastdb (for CLI)
        uses: actions/checkout@v4
        with:
          repository: EdgeVector/lastdb
          ref: ${{ inputs.lastdb-ref }}
          path: lastdb-repo
          persist-credentials: false

      - name: Set up Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build lastdb CLI
        working-directory: lastdb-repo
        run: |
          cargo build --release -p lastdb_node --bin lastdb
          ./target/release/lastdb --version
          echo "LASTDB_BIN=$PWD/target/release/lastdb" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/app-artifact

      - name: Verify artifact and manifest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/app-artifact"
          
          if [ ! -f provenance.json ]; then
            echo "::error::provenance.json missing from artifact"
            exit 1
          fi
          
          TREE_OID=$(jq -r '.tree_oid // empty' provenance.json)
          [ -n "$TREE_OID" ] || { echo "::error::tree_oid missing from provenance"; exit 1; }
          
          MANIFEST_PATH="${{ inputs.manifest-path }}"
          if [ ! -f "$MANIFEST_PATH" ]; then
            echo "::error::manifest not found at $MANIFEST_PATH"
            exit 1
          fi
          
          APP_UUID=$(jq -r '.app_uuid // empty' "$MANIFEST_PATH")
          [ -n "$APP_UUID" ] || { echo "::error::app_uuid missing from manifest"; exit 1; }
          
          {
            echo "APP_UUID=$APP_UUID"
            echo "TREE_OID=$TREE_OID"
            echo "MANIFEST_PATH=$RUNNER_TEMP/app-artifact/$MANIFEST_PATH"
          } >> "$GITHUB_ENV"
          
          echo "manifest: $MANIFEST_PATH"
          echo "app_uuid: $APP_UUID"
          echo "tree_oid: $TREE_OID"

      - name: Decode signing key
        env:
          KEY_BASE64: ${{ secrets.APP_PUBLISHER_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/publisher-key.txt"
          echo "$KEY_BASE64" | base64 -d > "$KEY_FILE"
          
          if [ ! -s "$KEY_FILE" ]; then
            echo "::error::signing key decode failed or returned empty"
            exit 1
          fi
          
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "decoded signing key from base64 secret"

      - name: Verify key matches registered owner_dev_pubkey
        env:
          APP_ID: ${{ inputs.app-id }}
          LASTDB_API_KEY: ${{ secrets.LASTDB_API_KEY }}
        run: |
          set -euo pipefail
          
          # Get the registered app's owner_dev_pubkey
          REGISTERED_PUBKEY=$(curl -sS "$DEV_REGISTRY_URL/v2/apps/$APP_ID" | jq -r '.owner_dev_pubkey // empty')
          
          if [ -z "$REGISTERED_PUBKEY" ]; then
            echo "::error::could not retrieve owner_dev_pubkey for $APP_ID from /v2 registry"
            exit 1
          fi
          
          echo "registered owner_dev_pubkey: $REGISTERED_PUBKEY"
          
          # Derive the pubkey from our signing key
          # TODO: The lastdb CLI should have a command to do this, but for now we check after publish
          echo "REGISTERED_PUBKEY=$REGISTERED_PUBKEY" >> "$GITHUB_ENV"

      - name: Create artifact tarball
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/app-artifact"
          ARTIFACT_TAR="$RUNNER_TEMP/${{ inputs.app-id }}-${{ github.sha }}.tar.gz"
          tar -czf "$ARTIFACT_TAR" .
          echo "ARTIFACT_TAR=$ARTIFACT_TAR" >> "$GITHUB_ENV"
          echo "artifact tarball: $ARTIFACT_TAR ($(stat -c%s "$ARTIFACT_TAR") bytes)"

      - name: Publish release to /v2 DEV
        env:
          LASTDB_API_KEY: ${{ secrets.LASTDB_API_KEY }}
          APP_ID: ${{ inputs.app-id }}
        run: |
          set -euo pipefail
          
          # The artifact is uploaded to GitHub, but /v2 needs a public URL
          # For now, we'll use the GitHub artifact URL or skip artifact-url
          # The release-publish command may accept inline artifact data
          
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/${{ inputs.artifact-name }}"
          
          "$LASTDB_BIN" app release-publish \
            --manifest "$MANIFEST_PATH" \
            --app-uuid "$APP_UUID" \
            --source-commit "$GITHUB_SHA" \
            --artifact "$ARTIFACT_TAR" \
            --artifact-url "$ARTIFACT_URL" \
            --env dev \
            --key-file "$KEY_FILE" \
            --api-key "$LASTDB_API_KEY" || {
              RC=$?
              echo "::error::lastdb app release-publish failed with exit code $RC"
              exit $RC
            }
          
          echo "✓ published $APP_ID release for commit $GITHUB_SHA to /v2 DEV"

      - name: Verify release is readable
        env:
          APP_ID: ${{ inputs.app-id }}
        run: |
          set -euo pipefail
          
          # Query the releases endpoint to confirm publication
          RELEASES=$(curl -sS "$DEV_REGISTRY_URL/v2/apps/$APP_ID/releases")
          COUNT=$(echo "$RELEASES" | jq '.releases | length')
          
          echo "releases endpoint returned $COUNT releases for $APP_ID"
          echo "$RELEASES" | jq .
          
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::no releases returned; publication may not have completed"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f "$KEY_FILE" "$ARTIFACT_TAR" 2>/dev/null || true
